<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AltuVera Pharmacy POS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
    }
    .logo {
      font-size: 32px;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #4ade80;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="logo">AltuVera Pharmacy</div>
  <div class="subtitle">Point of Sale</div>
  <div class="spinner"></div>
  <div class="status">Starting POS application...</div>
</body>
</html>
