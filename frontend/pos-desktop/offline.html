<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AltusVera Pharmacy POS — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    .logo { font-size: 28px; font-weight: 700; color: #4ade80; }
    .error { font-size: 15px; color: #f87171; }
    .hint { font-size: 13px; color: #666; text-align: center; line-height: 1.6; }
    button {
      margin-top: 8px;
      padding: 10px 28px;
      background: #4ade80;
      color: #111;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #22c55e; }
  </style>
</head>
<body>
  <div class="logo">AltusVera Pharmacy</div>
  <div class="error">Could not connect to POS application</div>
  <div class="hint">
    Make sure the POS React dev server is running on port 5120<br>
    and the API is running on port 8000.
  </div>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
